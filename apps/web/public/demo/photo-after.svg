<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2a4a" />
      <stop offset="0.55" stop-color="#5c4d8a" />
      <stop offset="1" stop-color="#c98a6b" />
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4d6" />
      <stop offset="0.4" stop-color="#f7ca6d" />
      <stop offset="1" stop-color="#f7ca6d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3f6e" />
      <stop offset="1" stop-color="#2c2440" />
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#332a4d" />
      <stop offset="1" stop-color="#1c1730" />
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171227" />
      <stop offset="1" stop-color="#0c0918" />
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2440" />
      <stop offset="1" stop-color="#0c0918" />
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)" />

  <!-- sun glow + disc -->
  <circle cx="1180" cy="330" r="260" fill="url(#sun)" />
  <circle cx="1180" cy="330" r="120" fill="#f5c66b" />

  <!-- birds -->
  <path d="M300 220 q18 -22 36 0 q18 -22 36 0" stroke="#1c1730" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M420 180 q14 -18 28 0 q14 -18 28 0" stroke="#1c1730" stroke-width="4" fill="none" stroke-linecap="round" />

  <!-- far mountain ridge -->
  <path d="M0 560 L220 380 L480 540 L760 340 L1020 520 L1300 400 L1600 520 V1000 H0 Z" fill="url(#ridgeFar)" />

  <!-- fog band 1 -->
  <rect x="0" y="540" width="1600" height="60" fill="#f5ede0" opacity="0.18" />

  <!-- mid mountain ridge -->
  <path d="M0 660 L280 480 L520 640 L820 440 L1100 620 L1380 500 L1600 610 V1000 H0 Z" fill="url(#ridgeMid)" />

  <!-- fog band 2 -->
  <rect x="0" y="640" width="1600" height="50" fill="#f5ede0" opacity="0.14" />

  <!-- lake with reflection -->
  <path d="M0 780 L1600 780 V1000 H0 Z" fill="url(#lake)" />
  <ellipse cx="1180" cy="800" rx="90" ry="26" fill="#f5c66b" opacity="0.35" />
  <path d="M0 780 L220 700 L480 770 L760 690 L1020 760 L1300 710 L1600 760 V780 Z" fill="#171227" opacity="0.5" />

  <!-- near mountain ridge / silhouette -->
  <path d="M0 770 L360 610 L700 750 L1050 630 L1400 760 L1600 700 V1000 H0 Z" fill="url(#ridgeNear)" />

  <!-- foreground pines -->
  <g fill="#0c0918">
    <path d="M120 900 L150 810 L180 900 Z" />
    <path d="M150 920 L180 830 L210 920 Z" />
    <path d="M1430 910 L1460 820 L1490 910 Z" />
    <path d="M1460 930 L1490 840 L1520 930 Z" />
  </g>
</svg>
