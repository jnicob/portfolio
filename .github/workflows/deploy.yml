name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Shared Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages and static export
        run: pnpm run build

      - name: Run quality checks
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test

      - name: Compress build output
        run: tar -czf deploy.tar.gz -C apps/web/out .

      - name: Deploy to production via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          scp -i ~/.ssh/id_deploy deploy.tar.gz "$SSH_USER@$SSH_HOST:~/deploy-portfolio.tar.gz"
          ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" "cd ~/public_html/jnicob.dev && tar -xzf ~/deploy-portfolio.tar.gz && rm ~/deploy-portfolio.tar.gz"
